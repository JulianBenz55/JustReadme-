# Baut die lokale/offline-Variante von Episteme als APK und hängt sie an ein GitHub-Release.
name: Build APK (oss offline)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Nicht android-actions/setup-android@v3 verwenden:
      # Diese Action fordert in dieser Umgebung das entfernte Paket "tools" an.
      # Die Runner-Images enthalten bereits Android command-line tools.
      - name: Android SDK einrichten
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android SDK oder cmdline-tools wurden auf dem Runner nicht gefunden."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager wurde nicht gefunden."
            exit 1
          fi

          echo "Android SDK: $SDK_ROOT"
          echo "sdkmanager: $SDKMANAGER"

          # 'yes' kann SIGPIPE erhalten, sobald sdkmanager fertig ist.
          # Deshalb hier absichtlich KEIN pipefail für diese Lizenz-Pipeline.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          LICENSE_STATUS=$?
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::Android SDK-Lizenzen konnten nicht akzeptiert werden."
            exit "$LICENSE_STATUS"
          fi

          # Das Projekt verwendet compileSdk 36. android-37 ist hier nicht nötig.
          SDK_PACKAGES=(
            "platform-tools"
            "platforms;android-36"
            "build-tools;36.0.0"
          )
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "${SDK_PACKAGES[@]}"

      - uses: gradle/actions/setup-gradle@v4

      # Signatur-Schlüssel: Mit den Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD
      # bleiben Updates über die alte Installation möglich.
      - name: Signing vorbereiten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          PASS="${KEYSTORE_PASSWORD:-episteme-local}"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.jks" \
              -alias episteme \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Episteme Local"
          fi
          {
            echo "MYAPP_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "MYAPP_RELEASE_STORE_PASSWORD=$PASS"
            echo "MYAPP_RELEASE_KEY_ALIAS=episteme"
            echo "MYAPP_RELEASE_KEY_PASSWORD=$PASS"
          } >> local.properties

      - name: APK bauen (oss, offline)
        run: ./gradlew :app:assembleOssReleaseOffline --no-daemon --max-workers=2 -Pkotlin.daemon.jvmargs=-Xmx4g

      - name: APK einsammeln
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs -name '*.apk' -print -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: episteme-apk
          path: dist/*.apk

      - name: Release mit APK anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk --title "Build ${{ github.run_number }}" \\
            --notes "Automatisch gebaut aus ${{ github.sha }}" --prerelease
