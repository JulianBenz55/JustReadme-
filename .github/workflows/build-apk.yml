# Baut die lokale/offline-Variante von Episteme als APK und hängt sie an ein GitHub-Release,
# damit du sie direkt auf dem Handy herunterladen und installieren kannst.
# Ablegen unter: .github/workflows/build-apk.yml
name: Build APK (oss offline)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Signatur-Schlüssel: Wenn du die Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD gesetzt hast,
      # werden Updates über die alte Installation möglich. Ohne Secrets wird pro Lauf ein
      # neuer Schlüssel erzeugt (dann vor einem Update die alte App deinstallieren).
      - name: Signing vorbereiten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          PASS="${KEYSTORE_PASSWORD:-episteme-local}"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -alias episteme \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Episteme Local"
          fi
          {
            echo "MYAPP_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "MYAPP_RELEASE_STORE_PASSWORD=$PASS"
            echo "MYAPP_RELEASE_KEY_ALIAS=episteme"
            echo "MYAPP_RELEASE_KEY_PASSWORD=$PASS"
          } >> local.properties

      - name: APK bauen (oss, offline)
        run: ./gradlew :app:assembleOssReleaseOffline --no-daemon --max-workers=2 -Pkotlin.daemon.jvmargs=-Xmx4g

      - name: APK einsammeln
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs -name '*.apk' -print -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: episteme-apk
          path: dist/*.apk

      - name: Release mit APK anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk --title "Build ${{ github.run_number }}" \
            --notes "Automatisch gebaut aus ${{ github.sha }}" --prerelease
