
# Baut die lokale/offline-Variante von Episteme als APK
# und hängt sie an ein GitHub-Release.

name: Build APK (oss offline)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      # 1. Repository
      - uses: actions/checkout@v4

      # 2. Java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 3. Android SDK
      - name: Android SDK einrichten
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android SDK oder cmdline-tools nicht gefunden."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager nicht gefunden."
            exit 1
          fi

          echo "Android SDK: $SDK_ROOT"
          echo "sdkmanager: $SDKMANAGER"

          # Lizenzen akzeptieren, ohne Broken-Pipe-Warnung
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::SDK-Lizenzen konnten nicht akzeptiert werden."
            exit "$LICENSE_STATUS"
          fi

          # Ursprüngliche SDK-Pakete beibehalten.
          # Kein nicht verfügbares android-37 installieren.
          SDK_PACKAGES=(
            "platform-tools"
            "platforms;android-36"
            "build-tools;36.0.0"
          )

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --install "${SDK_PACKAGES[@]}"

          echo "===== INSTALLIERTE ANDROID PLATTFORMEN ====="
          ls -la "$SDK_ROOT/platforms/"

          # compileSdk 37 wird vom Projekt verwendet.
          # Die bereits vorhandene Plattform wird nicht überschrieben.
          if [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            echo "::error::compileSdk 37 ist auf diesem Runner nicht installiert."
            exit 1
          fi

      # 4. Gradle Cache
      - uses: gradle/actions/setup-gradle@v4

      # 5. Gradle-Speicher konfigurieren
      - name: Configure Gradle memory
        shell: bash
        run: |
          set -euo pipefail

          touch gradle.properties

          cat >> gradle.properties <<'EOF'

          # CI memory configuration
          org.gradle.jvmargs=-Xms512m -Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          org.gradle.vfs.watch=false
          org.gradle.caching=true

          # Kotlin compiler daemon
          kotlin.daemon.jvmargs=-Xmx1g
          EOF

          echo "===== GRADLE MEMORY SETTINGS ====="
          tail -n 10 gradle.properties

      # 6. Wrapper absichern
      - name: Fix Gradle wrapper permissions
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          test -f gradle/wrapper/gradle-wrapper.jar

          ls -l ./gradlew

          ./gradlew --version

      # 7. Signierung vorbereiten
      - name: Signing vorbereiten
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          PASS="${KEYSTORE_PASSWORD:-episteme-local}"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d \
              > "$RUNNER_TEMP/release.jks"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.jks" \
              -alias episteme \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -dname "CN=Episteme Local"
          fi

          {
            echo "MYAPP_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "MYAPP_RELEASE_STORE_PASSWORD=$PASS"
            echo "MYAPP_RELEASE_KEY_ALIAS=episteme"
            echo "MYAPP_RELEASE_KEY_PASSWORD=$PASS"
          } >> local.properties

      # 8. Speicherdiagnose
      - name: Check build environment
        shell: bash
        run: |
          echo "===== SYSTEM MEMORY ====="
          free -h

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          cat gradle.properties

      # 9. APK bauen
      - name: APK bauen (oss, offline)
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            :app:assembleOssReleaseOffline \
            --no-daemon \
            --no-watch-fs \
            --max-workers=1 \
            --stacktrace

      # 10. APK einsammeln
      - name: APK einsammeln
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          find app/build/outputs \
            -type f \
            -name '*.apk' \
            -print \
            -exec cp {} dist/ \;

          if ! compgen -G "dist/*.apk" > /dev/null; then
            echo "::error::Keine APK erzeugt."
            exit 1
          fi

          echo "===== APK DATEIEN ====="
          ls -lh dist/

          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      # 11. APK Artifact
      - uses: actions/upload-artifact@v4
        with:
          name: episteme-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # 12. GitHub Release
      - name: Release mit APK anlegen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="build-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" dist/*.apk \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA}" \
            --prerelease

      # 13. Fehlerdiagnose
      - name: Build-Diagnose sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: episteme-build-diagnostics
          path: |
            app/build/reports/
            app/build/outputs/logs/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
