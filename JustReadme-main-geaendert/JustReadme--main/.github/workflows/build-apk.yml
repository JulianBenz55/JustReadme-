
name: Build APK (oss offline)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: oss-apk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build OSS Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      # 1. Repository herunterladen
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 2. Java 21 installieren
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # 3. Gradle Wrapper absichern
      - name: Fix Gradle wrapper permissions
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          test -f ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar

          echo "===== GRADLE WRAPPER ====="
          ls -l ./gradlew

          ./gradlew --version

      # 4. Android SDK einrichten
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK nicht gefunden."
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager nicht gefunden."
            exit 1
          fi

          echo "Android SDK: $SDK_ROOT"

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --install \
            "platform-tools" \
            "build-tools;36.0.0"

          echo "===== VORHANDENE SDK-PLATTFORMEN ====="
          ls -lah "$SDK_ROOT/platforms/"

          echo "===== ANDROID JAR DATEIEN ====="
          find "$SDK_ROOT/platforms" \
            -maxdepth 2 \
            -name android.jar \
            -print

          echo "===== SDK SETUP ABGESCHLOSSEN ====="

      # 5. Gradle einrichten
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: always

      # 6. Signierung vorbereiten
      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Release-Keystore fehlt. Bitte KEYSTORE_BASE64 und KEYSTORE_PASSWORD als GitHub Actions Secrets hinterlegen. Anleitung: SIGNING.md"
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          {
            echo "MYAPP_RELEASE_STORE_FILE=$KEYSTORE"
            echo "MYAPP_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MYAPP_RELEASE_KEY_ALIAS=episteme"
            echo "MYAPP_RELEASE_KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } >> local.properties

      # 7. Speicherdiagnose
      - name: Check available memory
        shell: bash
        run: |
          echo "===== SYSTEM MEMORY ====="
          free -h

          echo "===== JAVA ====="
          java -version

          echo "===== MEMORY CONFIGURATION ====="
          echo "Gradle heap: 3 GB"
          echo "Kotlin daemon heap: 2 GB"
          echo "Workers: 1"

      # 8. OSS Offline Release APK bauen
      - name: Build OSS Release APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            :app:assembleOssReleaseOffline \
            --no-daemon \
            --no-watch-fs \
            --max-workers=1 \
            --stacktrace \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xms512m -Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs=-Xmx2g

      # 9. Genau eine APK einsammeln
      - name: Collect single APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          mapfile -t APKS < <(find app/build/outputs/apk -type f -name '*.apk' ! -path '*/renamed-apk/*' | sort)

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Es wurden ${#APKS[@]} APK-Dateien gefunden; erwartet wird genau eine."
            printf '%s\\n' "${APKS[@]}"
            exit 1
          fi

          cp "${APKS[0]}" dist/Vellum.apk
          echo "===== RELEASE APK ====="
          ls -lh dist/Vellum.apk
          sha256sum dist/Vellum.apk

      # 10. APK direkt als Release-Datei veröffentlichen (kein ZIP-Artifact)
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="build-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" dist/Vellum.apk \
            --title "Vellum Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatischer Build.
          Commit: ${GITHUB_SHA}
          Build: ${GITHUB_RUN_NUMBER}" \
            --prerelease

      # 11. Fehlerdiagnose
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: episteme-build-diagnostics
          path: |
            app/build/reports/
            app/build/outputs/logs/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
